[project]
name = "aima-autohealer"
version = "0.1.0a0"
description = "AI-driven auto-healer for VLESS+REALITY subscription services. Probes connectivity, classifies DPI block types, and proposes mutations."
requires-python = ">=3.11"
authors = [{ name = "AiMa team" }]
readme = "README.md"

dependencies = [
    "pydantic>=2.7",
    "anyio>=4.4",
    "httpx>=0.27",
    "dnspython>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "typer>=0.12",
    "rich>=13.7",
    "sqlmodel>=0.0.22",
    "numpy>=1.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
aima = "aima.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aima"]

[tool.hatch.build.targets.wheel.force-include]
"src/aima/knowledge" = "aima/knowledge"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: long lines, B008: typer Option(...) defaults, SIM105: try/except/pass is more
# readable than contextlib.suppress for one-shot fire-and-forget cleanups.
ignore = ["E501", "B008", "SIM105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
