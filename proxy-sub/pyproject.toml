[project]
name = "proxy-sub"
version = "1.0.0"
description = "Proxy Subscription Service for Hiddify - auto-fetch, filter, serve VLESS/SS configs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
